<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your HangPlan password</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Supabase sends the reset email here (Auth → URL Configuration → Redirect URLs
    must include this page's URL). The tokens arrive in the URL fragment; we
    hand them straight to the app via its deep link so nothing touches this
    server. If the app isn't installed, the visitor gets clear instructions.
  -->
  <div class="center">
    <div class="box">
      <img src="icon.png" alt="">
      <h1 id="title">Opening HangPlan…</h1>
      <div class="spinner" id="spin"></div>
      <p id="msg">Hang on while we hand you back to the app to set a new password.</p>
      <p id="fallback" hidden>
        <a class="cta" id="open">Open HangPlan</a>
      </p>
      <p id="help" hidden style="font-size: 14px;">Nothing happening? Make sure HangPlan is installed on this phone, then tap the button above. Links expire after an hour — if it's been longer, request a new one from the sign-in screen.</p>
    </div>
  </div>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var params = new URLSearchParams((hash.replace(/^#/, '') + '&' + search.replace(/^\?/, '')));
      var err = params.get('error_description');
      var target = 'hangplan://reset-password' + (hash || search);
      var open = document.getElementById('open');
      open.href = target;
      if (err) {
        document.getElementById('title').textContent = 'That link has expired';
        document.getElementById('msg').textContent = decodeURIComponent(err.replace(/\+/g, ' ')) + '. Request a new one from the sign-in screen in the app.';
        document.getElementById('spin').hidden = true;
        return;
      }
      // Try the app right away; show the manual button after a moment in case
      // the handoff was blocked (desktop browser, app not installed).
      window.location.href = target;
      setTimeout(function () {
        document.getElementById('spin').hidden = true;
        document.getElementById('title').textContent = 'Finish in the app';
        document.getElementById('msg').textContent = 'Tap below to open HangPlan and choose a new password.';
        document.getElementById('fallback').hidden = false;
        document.getElementById('help').hidden = false;
      }, 1200);
    })();
  </script>
</body>
</html>
