<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your HangPlan password</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .field { width: 100%; box-sizing: border-box; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 17px; margin-top: 12px; outline: none; }
    .field:focus { border-color: var(--primary); }
    .btn { width: 100%; box-sizing: border-box; justify-content: center; margin-top: 16px; border: 0; cursor: pointer; font-size: 15px; }
    .btn[disabled] { opacity: 0.4; cursor: default; }
    .hint { font-size: 14px; min-height: 20px; margin: 10px 0 0; }
    .hint.err { color: #F87171; }
    .alt { display: inline-block; margin-top: 22px; font-size: 14px; color: var(--text-2); text-decoration: underline; }
  </style>
</head>
<body>
  <!--
    Supabase's password-reset email lands here with the session tokens in the
    URL fragment (#access_token=…&refresh_token=…&type=recovery). The new
    password is saved straight from this page through Supabase's auth API, so
    it works in any browser — Gmail's in-app browser included — without needing
    the app to open. "Open in HangPlan" is offered as an alternative.
  -->
  <div class="center">
    <div class="box">
      <img src="icon.png" alt="">
      <h1 id="title">Pick a new password</h1>
      <p id="msg">At least 8 characters. Then sign in to HangPlan with it.</p>

      <form id="form" hidden autocomplete="on">
        <input class="field" id="pw" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
        <input class="field" id="pw2" type="password" placeholder="Type it again" autocomplete="new-password" minlength="8" required>
        <p class="hint" id="hint"></p>
        <button class="cta btn" id="save" type="submit">SAVE PASSWORD</button>
      </form>

      <p id="done" hidden>
        <a class="cta" id="openapp" href="hangplan://">Open HangPlan</a>
      </p>
      <a class="alt" id="alt" href="#" hidden>Open in the app instead</a>
    </div>
  </div>
  <script>
    (function () {
      var SUPABASE_URL = 'https://zboorjnvmdulpioqprvg.supabase.co';
      var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpib29yam52bWR1bHBpb3FwcnZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2ODE0NjIsImV4cCI6MjA4ODI1NzQ2Mn0.zR9LGBXe_Pq9P9jq4xYti1U6ZwnXJ3VSYnrT6z7w51k';

      var $ = function (id) { return document.getElementById(id); };
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var params = new URLSearchParams(hash.replace(/^#/, '') + '&' + search.replace(/^\?/, ''));
      var access = params.get('access_token');
      var err = params.get('error_description') || params.get('error');

      function fail(title, text) {
        $('title').textContent = title;
        $('msg').textContent = text;
        $('form').hidden = true;
        $('alt').hidden = true;
      }

      if (err) {
        fail('That link has expired', decodeURIComponent(err.replace(/\+/g, ' ')) + '. Request a new one from the sign-in screen in the app.');
        return;
      }
      if (!access) {
        fail('That link didn’t work', 'It may have been used already. Open HangPlan, tap "Forgot password?" on the sign-in screen, and request a new link.');
        return;
      }

      // Hand-off to the app is optional; it only works from a real tap.
      var alt = $('alt');
      alt.href = 'hangplan://reset-password' + hash;
      alt.hidden = false;

      var form = $('form'), pw = $('pw'), pw2 = $('pw2'), hint = $('hint'), save = $('save');
      form.hidden = false;
      pw.focus();

      function check() {
        var ok = pw.value.length >= 8 && pw.value === pw2.value;
        save.disabled = !ok;
        hint.className = 'hint';
        hint.textContent = (pw2.value && pw.value !== pw2.value) ? 'Those don’t match yet.' : '';
        return ok;
      }
      pw.addEventListener('input', check);
      pw2.addEventListener('input', check);
      check();

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!check()) return;
        save.disabled = true;
        save.textContent = 'SAVING…';
        fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + access, 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value })
        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.body.msg || res.body.error_description || res.body.message || 'Something went wrong.');
            $('title').textContent = 'Password updated';
            $('msg').textContent = 'You’re all set. Open HangPlan and sign in with your new password.';
            form.hidden = true;
            alt.hidden = true;
            $('done').hidden = false;
          })
          .catch(function (e) {
            var m = (e && e.message) || 'Something went wrong.';
            if (/expired|invalid|jwt/i.test(m)) m = 'This link has expired. Request a new one from the sign-in screen in the app.';
            hint.className = 'hint err';
            hint.textContent = m;
            save.textContent = 'SAVE PASSWORD';
            save.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
